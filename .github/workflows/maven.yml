name: UI Test Automation Workflow 

on:
  schedule:
    - cron: 00 18 * * *
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Running Test Automation Framework with Maven
      run: mvn test -Dbrowser=chrome -DisLamda=false -DisHeadless=true

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
       name: Test logs
       path: logs
       if-no-files-found: warn

    - name: Upload Screenshot as Artifacts
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
       name: Screenshots
       path: screenshots/
       if-no-files-found: warn

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
       name: Test Reports
       path: test-reports
       if-no-files-found: warn

    # 7. Prepare files for GitHub Pages
    - name: Prepare Report for GitHub Pages
      if: always()
      run: |
        mkdir -p public/extent-reports/test-reports

        latest_report=$(ls -t test-reports/*.html | head -n 1)

        echo "Latest report: $latest_report"

        cp "$latest_report" public/extent-reports/test-reports/index.html

        cp -R screenshots/ public/extent-reports/

        echo "Files prepared for GitHub Pages:"
        ls -la public/extent-reports/
        ls -la public/extent-reports/test-reports/
        ls -la public/extent-reports/screenshots/

    # 8. Deploy report to GitHub Pages
    - name: Deploy Report to GitHub Pages
      if: always()
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: public/extent-reports/
        token: ${{ secrets.PERSONAL_TOKEN }}
        clean: true
       
    - name: Test Execution Status
      if: always()
      run: echo "Test execution and artifact collection completed."
      
