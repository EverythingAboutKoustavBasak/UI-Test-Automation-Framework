name: UI Test Automation Workflow 

on:
  schedule:
    - cron: 00 18 * * *
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Running Test Automation Framework with Maven
      run: mvn test -Dbrowser=chrome -DisLamda=false -DisHeadless=true

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
       name: Test logs
       path: logs

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4.4.3
      with:
       name: Test Reports
       path: test-reports
       
    - name: Test Execution Status
      if: always()
      run: echo "Test Execution Completed"
      
